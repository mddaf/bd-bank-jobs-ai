name: Bank Job Monitor

on:
  schedule:
    # Run every 30 minutes from 6 AM to 11 PM BST (UTC+6)
    # That's midnight to 5 PM UTC
    - cron: '*/30 0-17 * * *'
  workflow_dispatch:  # Allow manual 1-click trigger

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Database Cache
        uses: actions/cache/restore@v4
        with:
          path: storage/jobs.db
          key: jobs-db-${{ github.run_id }}
          restore-keys: |
            jobs-db-

      - name: Run job monitor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python main.py

      - name: Save Database Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: storage/jobs.db
          key: jobs-db-${{ github.run_id }}

      - name: Upload database backup artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jobs-db
          path: storage/jobs.db
          retention-days: 90
          overwrite: true

      - name: Upload run logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monitor-logs-${{ github.run_number }}
          path: monitor.log
          retention-days: 7
